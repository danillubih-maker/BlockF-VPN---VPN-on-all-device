<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; background: #0f0f12; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; border-radius: 12px; }
    h3 { margin: 0 0 5px; color: #00ffff; font-size: 1.1rem; letter-spacing: 1px; }
    p { margin: 0 0 20px; font-size: 0.75rem; color: #8f8f9d; }
    #status { font-weight: bold; font-size: 0.85rem; margin-bottom: 20px; transition: 0.3s; }
    button { width: 100%; padding: 14px; background: #00ffff; border: none; border-radius: 10px; font-weight: bold; font-size: 0.95rem; color: #000; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,255,255,0.2); }
    button:hover { background: #00cccc; transform: scale(1.02); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h3>BLOCK FUN NET</h3>
  <p>Universal Auto-Proxy</p>
  <div id="status" style="color: #ff3333;">STATUS: DISCONNECTED</div>
  <button id="connectBtn">CONNECT</button>
  <script src="popup.js"></script>
</body>
</html>
